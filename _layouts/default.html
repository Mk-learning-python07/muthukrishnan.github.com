<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f16">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author | default: site.title }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/Files/Logo.jpeg' | absolute_url }}">
  <link rel="icon" href="{{ '/Files/Logo.jpeg' | relative_url }}" type="image/jpeg">
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QEPCGSFX9V"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-QEPCGSFX9V');</script>
</head>

<body>
  <div id="progress" aria-hidden="true"></div>

  <header class="top-bar" id="top-bar">
    <a href="{{ site.baseurl }}/" class="brand-link" aria-label="{{ site.title }} home">
      <img src="{{ site.baseurl }}/Files/MK_ID_Photo.jpg" alt="{{ site.title }}" class="brand-avatar" loading="lazy" width="36" height="36">
      <div class="brand-text">
        <strong>Muthukrishnan Anand</strong>
        <span>Graduate Researcher &middot; Carbon Capture</span>
      </div>
    </a>
  </header>

  <nav class="dot-nav" aria-label="Page navigation">
    <a href="{{ site.baseurl }}/"                        class="dot-item {% if page.url == '/' %}active{% endif %}"                      data-label="Home"       aria-label="Home"><span class="dot"></span></a>
    <a href="{{ site.baseurl }}/about-me/"               class="dot-item {% if page.url contains 'about' %}active{% endif %}"            data-label="About Me"   aria-label="About Me"><span class="dot"></span></a>
    <a href="{{ site.baseurl }}/professional-experience/" class="dot-item {% if page.url contains 'professional' %}active{% endif %}"   data-label="Experience" aria-label="Experience"><span class="dot"></span></a>
    <a href="{{ site.baseurl }}/research/"               class="dot-item {% if page.url contains 'research' %}active{% endif %}"         data-label="Research"   aria-label="Research"><span class="dot"></span></a>
    <a href="{{ site.baseurl }}/contact/"                class="dot-item {% if page.url contains 'contact' %}active{% endif %}"          data-label="Contact"    aria-label="Contact"><span class="dot"></span></a>
  </nav>

  <nav class="bottom-nav" aria-label="Mobile navigation">
    <a href="{{ site.baseurl }}/"                         class="{% if page.url == '/' %}active{% endif %}">
      <i class="fas fa-house" aria-hidden="true"></i><span>Home</span>
    </a>
    <a href="{{ site.baseurl }}/about-me/"                class="{% if page.url contains 'about' %}active{% endif %}">
      <i class="fas fa-user" aria-hidden="true"></i><span>About</span>
    </a>
    <a href="{{ site.baseurl }}/professional-experience/" class="{% if page.url contains 'professional' %}active{% endif %}">
      <i class="fas fa-briefcase" aria-hidden="true"></i><span>Work</span>
    </a>
    <a href="{{ site.baseurl }}/research/"                class="{% if page.url contains 'research' %}active{% endif %}">
      <i class="fas fa-flask" aria-hidden="true"></i><span>Research</span>
    </a>
    <a href="{{ site.baseurl }}/contact/"                 class="{% if page.url contains 'contact' %}active{% endif %}">
      <i class="fas fa-envelope" aria-hidden="true"></i><span>Contact</span>
    </a>
  </nav>

  <main id="content" class="main-content" role="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-social">
      {% if site.linkedin %}<a href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" class="social-icon"><i class="fab fa-linkedin" aria-hidden="true"></i></a>{% endif %}
      {% if site.email %}<a href="mailto:{{ site.email }}" aria-label="Email" class="social-icon"><i class="fas fa-envelope" aria-hidden="true"></i></a>{% endif %}
      {% if site.github %}<a href="{{ site.github }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub" class="social-icon"><i class="fab fa-github" aria-hidden="true"></i></a>{% endif %}
    </div>
    <p class="footer-copy">&copy; {{ site.time | date: '%Y' }} {{ site.title }} &middot; Built with <a href="https://jekyllrb.com" target="_blank" rel="noopener noreferrer">Jekyll</a></p>
  </footer>

  <script>
  (function () {
    var prog   = document.getElementById('progress');
    var topBar = document.getElementById('top-bar');

    function onScroll() {
      var pct = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;
      prog.style.width = Math.min(pct, 100) + '%';
      topBar.classList.toggle('scrolled', window.scrollY > 20);
    }
    window.addEventListener('scroll', onScroll, { passive: true });

    var sel = '.main-content h2, .main-content h3, .main-content p, .main-content ul, .main-content ol, .main-content blockquote, .main-content table, .main-content .card';
    var els = document.querySelectorAll(sel);
    els.forEach(function (el) { el.classList.add('reveal'); });

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
      els.forEach(function (el) { io.observe(el); });
    } else {
      els.forEach(function (el) { el.classList.add('visible'); });
    }

    document.querySelectorAll('a[href^="#"]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        var t = document.querySelector(this.getAttribute('href'));
        if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth' }); }
      });
    });
  })();
  </script>
</body>
</html>
